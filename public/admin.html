<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WINTECH Admin Dashboard</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #06141f;
        --bg-soft: #0d1f2b;
        --text: #edf6ff;
        --muted: #a8bfd2;
        --brand: #35e0a1;
        --success: #10b981;
        --danger: #ef4444;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #041018 0%, #071821 100%);
        color: var(--text);
        min-height: 100vh;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }

      header {
        background: rgba(12, 28, 37, 0.8);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 20px 0;
        margin-bottom: 30px;
      }

      header h1 {
        font-size: 2rem;
        color: var(--brand);
      }

      .auth-section {
        background: rgba(12, 28, 37, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 30px;
      }

      .auth-section input {
        width: 100%;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(5, 14, 20, 0.7);
        color: var(--text);
        border-radius: 8px;
        margin-bottom: 10px;
      }

      button {
        background: linear-gradient(135deg, var(--brand), #85f0c7);
        color: #061922;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .stat-card {
        background: rgba(12, 28, 37, 0.8);
        border: 1px solid rgba(53, 224, 161, 0.2);
        border-radius: 16px;
        padding: 20px;
        text-align: center;
      }

      .stat-card h3 {
        color: var(--muted);
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 10px;
      }

      .stat-card .value {
        font-size: 2.5rem;
        font-weight: 800;
        color: var(--brand);
      }

      .controls {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      .controls input {
        flex: 1;
        min-width: 200px;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(5, 14, 20, 0.7);
        color: var(--text);
        border-radius: 8px;
      }

      .members-table {
        background: rgba(12, 28, 37, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        overflow: hidden;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        background: rgba(255, 255, 255, 0.04);
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        font-weight: 700;
        text-transform: uppercase;
        font-size: 0.82rem;
        letter-spacing: 0.1em;
        color: var(--muted);
      }

      td {
        padding: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      tr:hover {
        background: rgba(255, 255, 255, 0.02);
      }

      .status-badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .status-completed {
        background: rgba(16, 185, 129, 0.2);
        color: var(--success);
      }

      .plan-badge {
        background: rgba(53, 224, 161, 0.1);
        color: var(--brand);
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 0.82rem;
        font-weight: 700;
      }

      .error {
        background: rgba(239, 68, 68, 0.1);
        color: var(--danger);
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
      }

      .success {
        background: rgba(16, 185, 129, 0.1);
        color: var(--success);
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
      }

      .loading {
        text-align: center;
        padding: 40px;
        color: var(--muted);
      }

      .plan-breakdown {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        margin: 20px 0;
      }

      .plan-item {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(53, 224, 161, 0.1);
        border-radius: 12px;
        padding: 15px;
      }

      .plan-item-name {
        color: var(--muted);
        font-size: 0.85rem;
        text-transform: uppercase;
        margin-bottom: 8px;
      }

      .plan-item-count {
        font-size: 1.8rem;
        font-weight: 800;
        color: var(--brand);
        margin-bottom: 5px;
      }

      .plan-item-revenue {
        color: var(--muted);
        font-size: 0.9rem;
      }

      @media (max-width: 768px) {
        table {
          font-size: 0.9rem;
        }

        th,
        td {
          padding: 8px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container">
        <h1>WINTECH Admin Dashboard</h1>
        <p style="color: var(--muted); margin-top: 5px;">Member registrations and payment tracking</p>
      </div>
    </header>

    <div class="container">
      <div class="auth-section">
        <h3>Authentication</h3>
        <p style="color: var(--muted); margin-bottom: 10px; font-size: 0.9rem;">
          Enter your admin key to view member data.
        </p>
        <input type="password" id="adminKey" placeholder="Enter admin secret key" />
        <button onclick="authenticateAdmin()">Access Dashboard</button>
        <div id="authError" class="error" style="display: none;"></div>
      </div>

      <div id="dashboardContent" style="display: none;">
        <div class="stats-grid" id="statsGrid"></div>

        <div class="controls">
          <input type="text" id="searchInput" placeholder="Search by name, email, phone, or reference..." />
          <button onclick="searchMembers()">Search</button>
          <button onclick="exportMembers()" style="background: rgba(53, 224, 161, 0.2); color: var(--brand);">
            Export CSV
          </button>
          <button onclick="refreshData()" style="background: rgba(255, 255, 255, 0.05); color: var(--text);">
            Refresh
          </button>
        </div>

        <div id="searchResults" style="display: none;"></div>

        <div class="members-table">
          <div id="membersLoading" class="loading">Loading members...</div>
          <div id="membersContent" style="display: none;">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Plan</th>
                  <th>Amount (₦)</th>
                  <th>Reference</th>
                  <th>Date</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="membersList"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script>
      const API_URL = window.location.origin;
      let currentAdminKey = '';

      async function authenticateAdmin() {
        const key = document.getElementById('adminKey').value.trim();

        if (!key) {
          showAuthError('Please enter your admin key');
          return;
        }

        try {
          const response = await fetch(`${API_URL}/api/admin/stats?key=${encodeURIComponent(key)}`);

          if (!response.ok) {
            showAuthError('Invalid admin key');
            return;
          }

          currentAdminKey = key;
          document.querySelector('.auth-section').style.display = 'none';
          document.getElementById('dashboardContent').style.display = 'block';
          await loadDashboard();
        } catch (error) {
          showAuthError('Error authenticating: ' + error.message);
        }
      }

      async function loadDashboard() {
        try {
          const response = await fetch(`${API_URL}/api/admin/stats?key=${encodeURIComponent(currentAdminKey)}`);
          const data = await response.json();

          renderStats(data);
          await loadMembers();
        } catch (error) {
          console.error('Error loading dashboard:', error);
        }
      }

      function renderStats(data) {
        const statsGrid = document.getElementById('statsGrid');
        const totalRevenue = data.totalRevenue.toLocaleString();

        statsGrid.innerHTML = `
          <div class="stat-card">
            <h3>Total Members</h3>
            <div class="value">${data.totalMembers}</div>
          </div>
          <div class="stat-card">
            <h3>Total Revenue</h3>
            <div class="value">₦${totalRevenue}</div>
          </div>
          <div class="stat-card">
            <h3>Avg Payment</h3>
            <div class="value">₦${data.totalMembers > 0 ? Math.round(data.totalRevenue / data.totalMembers).toLocaleString() : '0'}</div>
          </div>
        `;

        // Add plan breakdown
        let breakdownHtml = '<div class="plan-breakdown">';
        Object.entries(data.planBreakdown).forEach(([plan, stats]) => {
          breakdownHtml += `
            <div class="plan-item">
              <div class="plan-item-name">${plan}</div>
              <div class="plan-item-count">${stats.count}</div>
              <div class="plan-item-revenue">₦${stats.revenue.toLocaleString()}</div>
            </div>
          `;
        });
        breakdownHtml += '</div>';
        statsGrid.innerHTML += breakdownHtml;
      }

      async function loadMembers() {
        const membersList = document.getElementById('membersList');
        const membersLoading = document.getElementById('membersLoading');
        const membersContent = document.getElementById('membersContent');

        try {
          const response = await fetch(`${API_URL}/api/admin/members?key=${encodeURIComponent(currentAdminKey)}`);
          const data = await response.json();

          if (data.members && data.members.length > 0) {
            membersList.innerHTML = data.members
              .map(
                (member) => `
              <tr>
                <td>${member.fullName}</td>
                <td>${member.email}</td>
                <td>${member.phone}</td>
                <td><span class="plan-badge">${member.plan}</span></td>
                <td>₦${member.amount.toLocaleString()}</td>
                <td><code style="font-size: 0.85rem;">${member.reference}</code></td>
                <td>${new Date(member.date).toLocaleDateString()}</td>
                <td><span class="status-badge status-${member.status}">${member.status}</span></td>
              </tr>
            `
              )
              .join('');
          } else {
            membersList.innerHTML = '<tr><td colspan="8" style="text-align: center; color: var(--muted);">No members yet</td></tr>';
          }

          membersLoading.style.display = 'none';
          membersContent.style.display = 'block';
        } catch (error) {
          console.error('Error loading members:', error);
          membersLoading.innerHTML = '<div style="color: var(--danger);">Error loading members</div>';
        }
      }

      async function searchMembers() {
        const query = document.getElementById('searchInput').value.trim();

        if (!query) {
          document.getElementById('searchResults').style.display = 'none';
          return;
        }

        try {
          const response = await fetch(`${API_URL}/api/admin/members/search?key=${encodeURIComponent(currentAdminKey)}&q=${encodeURIComponent(query)}`);
          const data = await response.json();

          const resultsDiv = document.getElementById('searchResults');
          if (data.results && data.results.length > 0) {
            let html = `<div class="success">Found ${data.results.length} result(s)</div>`;
            html += `
              <div class="members-table" style="margin-top: 20px;">
                <table>
                  <thead>
                    <tr>
                      <th>Name</th>
                      <th>Email</th>
                      <th>Phone</th>
                      <th>Plan</th>
                      <th>Amount (₦)</th>
                      <th>Reference</th>
                      <th>Date</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${data.results
                      .map(
                        (member) => `
                      <tr>
                        <td>${member.fullName}</td>
                        <td>${member.email}</td>
                        <td>${member.phone}</td>
                        <td><span class="plan-badge">${member.plan}</span></td>
                        <td>₦${member.amount.toLocaleString()}</td>
                        <td><code style="font-size: 0.85rem;">${member.reference}</code></td>
                        <td>${new Date(member.date).toLocaleDateString()}</td>
                      </tr>
                    `
                      )
                      .join('')}
                  </tbody>
                </table>
              </div>
            `;
            resultsDiv.innerHTML = html;
          } else {
            resultsDiv.innerHTML = '<div class="error">No members found matching your search</div>';
          }
          resultsDiv.style.display = 'block';
        } catch (error) {
          console.error('Error searching members:', error);
        }
      }

      async function exportMembers() {
        try {
          const url = `${API_URL}/api/admin/members/export?key=${encodeURIComponent(currentAdminKey)}`;
          const link = document.createElement('a');
          link.href = url;
          link.download = 'wintech_members.csv';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        } catch (error) {
          console.error('Error exporting members:', error);
        }
      }

      async function refreshData() {
        await loadDashboard();
      }

      function showAuthError(message) {
        const errorDiv = document.getElementById('authError');
        errorDiv.textContent = message;
        errorDiv.style.display = 'block';
        setTimeout(() => {
          errorDiv.style.display = 'none';
        }, 5000);
      }

      // Allow Enter key to submit
      document.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          if (!currentAdminKey) {
            authenticateAdmin();
          }
        }
      });
    </script>
  </body>
</html>
